name: Antwerp live water data

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch: {}       # allows manual "Run workflow" for testing

permissions:
  contents: write

jobs:
  fetch-live-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch RWS live water data
        run: node scripts/fetch-antwerp-live.mjs

      - name: Commit live.json / debug.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add antwerp/live.json antwerp/debug.json
          if git diff --cached --quiet; then
            echo "No change to live.json/debug.json"
          else
            git commit -m "Update Antwerp live water data [skip ci]"
            # This file is fully regenerated every run — on conflict, keep OUR
            # freshly-fetched data rather than trying to line-merge two snapshots.
            git pull --rebase -X theirs
            git push
          fi
