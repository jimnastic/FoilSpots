name: Antwerp live water data

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch: {}       # allows manual "Run workflow" for testing

permissions:
  contents: write

jobs:
  fetch-live-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch RWS live water data
        run: node scripts/fetch-antwerp-live.mjs

      - name: Commit live.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- antwerp/live.json; then
            echo "No change to live.json"
          else
            git add antwerp/live.json
            git commit -m "Update Antwerp live water data [skip ci]"
            git push
          fi
