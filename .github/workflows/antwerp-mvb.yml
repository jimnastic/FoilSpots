name: Antwerp MVB (Belgian coast) discovery

on:
  workflow_dispatch: {}   # manual only — this is a discovery run, not scheduled yet

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover MVB catalog shape
        env:
          MVB_USERNAME: ${{ secrets.MVB_USERNAME }}
          MVB_PASSWORD: ${{ secrets.MVB_PASSWORD }}
        run: node scripts/fetch-antwerp-mvb.mjs

      - name: Commit mvb-debug.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add antwerp/mvb-debug.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update MVB discovery debug [skip ci]"
            git pull --rebase
            git push
          fi
