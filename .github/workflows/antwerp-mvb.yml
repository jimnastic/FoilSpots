name: Antwerp MVB (Belgian coast) live data

on:
  workflow_dispatch: {}   # manual only for now — switch to a schedule once verified working

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch MVB live water temp / wind
        env:
          MVB_USERNAME: ${{ secrets.MVB_USERNAME }}
          MVB_PASSWORD: ${{ secrets.MVB_PASSWORD }}
        run: node scripts/fetch-antwerp-mvb.mjs

      - name: Commit mvb-live.json / mvb-debug.json if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add antwerp/mvb-live.json antwerp/mvb-debug.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update MVB live data [skip ci]"
            # These files are fully regenerated every run, so on conflict always keep OUR
            # freshly-fetched content rather than trying to line-merge two snapshots.
            # (During `rebase`, "theirs" = the commit being replayed, i.e. this run's data.)
            git pull --rebase -X theirs
            git push
          fi
